services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    container_name: eparking-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - eparking-sql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null',
        ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: eparking-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RabbitMQ__Username}"
      RABBITMQ_DEFAULT_PASS: "${RabbitMQ__Password}"
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: eParking.WebAPI/Dockerfile
    container_name: eparking-api
    env_file:
      - .env
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "5126:8080"
    restart: on-failure

  worker:
    build:
      context: .
      dockerfile: eParking.Worker/Dockerfile
    container_name: eparking-worker
    env_file:
      - .env
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    restart: on-failure

volumes:
  eparking-sql-data:
